services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: oracle-origem
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-SenhaSys123}
      APP_USER: ${ORACLE_USER:-app}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-SenhaApp123}
    volumes:
      - ./init:/container-entrypoint-initdb.d
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  oracle-data:
